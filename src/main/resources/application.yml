spring:
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      acks: all
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        enable.idempotence: true
    consumer:
      group-id: novabank-transfer-consumer
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: com.dch.training.novabank.event
        spring.json.value.default.type: com.dch.training.novabank.event.TransferRequestedEvent
        spring.json.use.type.headers: false
    listener:
      ack-mode: manual_immediate
  datasource:
    url: jdbc:postgresql://localhost:5432/novabank
    username: novabank
    password: novabank
  jpa:
    hibernate:
      ddl-auto: validate
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml

novabank:
  kafka:
    topics:
      transfer-requested: bank.transfers.requested
      transfer-requested-dlt: bank.transfers.requested.dlt
  outbox:
    poll-interval-ms: 1000
    publish-timeout-seconds: 5